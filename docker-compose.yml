services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - exam_data:/app/data
    environment:
      EXAM_DB: /app/data/app.db
      # Raw uploaded CSVs are staged here while a job is queued/running and
      # reclaimed once it finishes; lives on the same persistent volume.
      EXAM_STAGING_DIR: /app/data/staging
    restart: unless-stopped

volumes:
  exam_data:
